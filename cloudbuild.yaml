logsBucket: "gs://gcp-class-17-cloudbuild-logs"

substitutions:
  _REGION: us-central1
  _LOCATION: us-central1
  _AR_REPO: frontend
  _IMAGE: frontend-image
  _SERVICE: bank-frontend
  _BACKEND_SERVICE: bank-backend
  _TAG: "${SHORT_SHA}"

steps:

  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      [
        "build",
        "-t", "${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE}:${_TAG}",
        "."
      ]

  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      [
        "push",
        "${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE}:${_TAG}"
      ]

  - id: deploy-to-cloud-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        echo "Fetching backend URL..."
        BACKEND_URL=$(gcloud run services describe "${_BACKEND_SERVICE}" \
          --region "${_REGION}" \
          --format='value(status.url)')
        
        echo "Backend URL = $BACKEND_URL"
        echo "Deploying frontend to Cloud Run..."

        gcloud run deploy "${_SERVICE}" \
          --image "${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE}:${_TAG}" \
          --region "${_REGION}" \
          --allow-unauthenticated \
          --set-env-vars "API_BASE_URL=${BACKEND_URL}"

